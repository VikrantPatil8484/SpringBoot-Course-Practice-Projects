spring.application.name=Electronic-store

#database configurations
#spring.datasource.url=jdbc:mysql://localhost:3306/electronic-store
spring.datasource.url=jdbc:mysql://localhost:3306/electronic-store?useSSL=false&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#jpa configurations hibernrate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#file configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Path configurations for the creating the folder within project and stroring the images in that particular folder as per the requirements
user.profile.image.path=images/users/
product.image.path=images/products/

